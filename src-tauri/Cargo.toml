[package]
name = "midi2box"
version = "0.1.0"
description = "Convert MIDI files to 30-note paper strip music box sheets"
authors = ["MIDI2Box"]
edition = "2021"

[lib]
name = "midi2box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.0", features = [] }
tauri-plugin-dialog = "2"
